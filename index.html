<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luna</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      color: #666;
    }

    .result {
      margin-top: 25px;
      background: #f7f7f7;
      border-radius: 12px;
      padding: 20px;
    }

    .result h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .food-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .food-name {
      font-weight: bold;
    }

    .food-details {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .calories {
      font-weight: bold;
      white-space: nowrap;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Talk to Luna</h1>

    <p class="subtitle">
      Tell Luna what you ate, your workout, or how you're feeling.
    </p>

    <div class="card">

      <label for="userId">User ID</label>

      <input
        id="userId"
        type="text"
        placeholder="e.g. Saloni"
      >

      <label for="note">What happened?</label>

      <textarea
        id="note"
        placeholder="e.g. I had two eggs and toast for breakfast"
      ></textarea>

      <button
        id="submitButton"
        onclick="submitEntry()"
      >
        Send to Luna
      </button>

      <div id="message" class="message"></div>

      <div id="result" class="result hidden"></div>

    </div>

  </div>

  <script>
    async function submitEntry() {

      const userId =
        document.getElementById("userId").value.trim();

      const note =
        document.getElementById("note").value.trim();

      const message =
        document.getElementById("message");

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("submitButton");

      if (!userId || !note) {
        message.textContent =
          "Please enter your User ID and note.";

        result.classList.add("hidden");

        return;
      }

      message.textContent =
        "Luna is thinking...";

      result.classList.add("hidden");

      button.disabled = true;

      try {

        const response = await fetch("/api/process", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            userId: userId,
            note: note
          })
        });

        const data = await response.json();

        if (!response.ok) {

          message.textContent =
            data.error || "Something went wrong.";

          button.disabled = false;

          return;
        }

        message.textContent =
          "Logged successfully 🎉";

        displayFoodResult(data.foods || []);

        button.disabled = false;

      } catch (error) {

        console.error(error);

        message.textContent =
          "Could not connect to Luna. Please try again.";

        button.disabled = false;
      }
    }


    function displayFoodResult(foods) {

      const result =
        document.getElementById("result");

      if (!foods.length) {

        result.innerHTML =
          "<h2>No food items detected.</h2>";

        result.classList.remove("hidden");

        return;
      }

      let totalCalories = 0;

      let html =
        "<h2>Here's what Luna logged</h2>";

      foods.forEach(function(food) {

        const calories =
          Number(food.calories) || 0;

        totalCalories += calories;

        const quantity =
          food.quantity_grams
            ? food.quantity_grams + "g"
            : "";

        html += `
          <div class="food-row">

            <div>
              <div class="food-name">
                ${escapeHtml(food.food_item || "Food")}
              </div>

              <div class="food-details">
                ${escapeHtml(quantity)}
                ${food.meal_type ? " · " + escapeHtml(food.meal_type) : ""}
              </div>
            </div>

            <div class="calories">
              ${calories} kcal
            </div>

          </div>
        `;
      });

      html += `
        <div class="total">
          <span>Total</span>
          <span>${totalCalories} kcal</span>
        </div>
      `;

      result.innerHTML = html;

      result.classList.remove("hidden");
    }


    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>

</body>
</html>
