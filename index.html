<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luna</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      color: #666;
    }

    .result {
      margin-top: 25px;
      background: #f7f7f7;
      border-radius: 12px;
      padding: 20px;
    }

    .result h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .row {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row-title {
      font-weight: bold;
    }

    .row-details {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    .debug {
      margin-top: 15px;
      padding: 12px;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Talk to Luna</h1>

    <p class="subtitle">
      Tell Luna what you ate, your workout, or how you're feeling.
    </p>

    <div class="card">

      <label for="userId">User ID</label>

      <input
        id="userId"
        type="text"
        placeholder="e.g. Saloni"
      >

      <label for="note">What happened?</label>

      <textarea
        id="note"
        placeholder="e.g. I did 3 sets of squats, 10 reps each, with 40 kg"
      ></textarea>

      <button
        id="submitButton"
        onclick="submitEntry()"
      >
        Send to Luna
      </button>

      <div id="message" class="message"></div>

      <div id="result" class="result hidden"></div>

    </div>

  </div>


  <script>

    async function submitEntry() {

      const userId =
        document.getElementById("userId").value.trim();

      const note =
        document.getElementById("note").value.trim();

      const message =
        document.getElementById("message");

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("submitButton");


      if (!userId || !note) {

        message.textContent =
          "Please enter your User ID and note.";

        result.classList.add("hidden");

        return;
      }


      message.textContent =
        "Luna is thinking...";

      result.classList.add("hidden");

      button.disabled = true;


      try {

        const response =
          await fetch("/api/process", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              userId: userId,
              note: note
            })

          });


        const data =
          await response.json();


        console.log(
          "Luna response:",
          data
        );


        if (!response.ok) {

          message.textContent =
            data.error ||
            "Something went wrong.";

          showDebug(data);

          button.disabled = false;

          return;
        }


        message.textContent =
          "Logged successfully 🎉";


        displayResult(data);


        button.disabled = false;


      } catch (error) {

        console.error(error);

        message.textContent =
          "Could not connect to Luna. Please try again.";

        button.disabled = false;
      }
    }


    function displayResult(data) {

      const result =
        document.getElementById("result");


      const type =
        data.type || "unknown";


      const foods =
        Array.isArray(data.foods)
          ? data.foods
          : [];


      const workouts =
        Array.isArray(data.workouts)
          ? data.workouts
          : [];


      let html = "";


      // FOOD RESULT

      if (foods.length > 0) {

        let totalCalories = 0;

        html +=
          "<h2>Here's what Luna logged</h2>";


        foods.forEach(function(food) {

          const calories =
            Number(food.calories) || 0;

          totalCalories += calories;


          html += `
            <div class="row">

              <div class="row-title">
                ${escapeHtml(food.food_item || "Food")}
              </div>

              <div class="row-details">
                ${escapeHtml(
                  food.quantity_grams
                    ? food.quantity_grams + "g"
                    : ""
                )}

                ${
                  food.meal_type
                    ? " · " + escapeHtml(food.meal_type)
                    : ""
                }

                · ${calories} kcal
              </div>

            </div>
          `;
        });


        html += `
          <div class="total">
            <span>Total</span>
            <span>${totalCalories} kcal</span>
          </div>
        `;
      }


      // WORKOUT RESULT

      if (workouts.length > 0) {

        if (foods.length === 0) {

          html +=
            "<h2>Here's what Luna logged</h2>";
        }


        workouts.forEach(function(workout) {

          let details = [];


          if (workout.set_number) {

            details.push(
              "Set " +
              workout.set_number
            );
          }


          if (workout.reps_completed) {

            details.push(
              workout.reps_completed +
              " reps"
            );
          }


          if (workout.weight_value) {

            details.push(
              workout.weight_value +
              " " +
              (workout.weight_type || "")
            );
          }


          if (workout.duration_mins) {

            details.push(
              workout.duration_mins +
              " min"
            );
          }


          html += `
            <div class="row">

              <div class="row-title">
                ${escapeHtml(
                  workout.exercise ||
                  "Workout"
                )}
              </div>

              <div class="row-details">
                ${escapeHtml(
                  details.join(" · ")
                )}
              </div>

            </div>
          `;
        });


        html += `
          <div class="total">
            <span>Workout rows added</span>
            <span>
              ${data.workoutRowsAdded || 0}
            </span>
          </div>
        `;
      }


      // NOTHING DETECTED

      if (
        foods.length === 0 &&
        workouts.length === 0
      ) {

        html +=
          "<h2>No food or workout details returned.</h2>";
      }


      // DEBUG INFORMATION

      html += `
        <div class="debug">
          <strong>Processing details</strong><br>
          Type detected: ${escapeHtml(type)}<br>
          Food items: ${foods.length}<br>
          Workout items: ${workouts.length}<br>
          Food rows added: ${data.foodRowsAdded || 0}<br>
          Workout rows added: ${data.workoutRowsAdded || 0}<br>
          Total rows added: ${data.rowsAdded || 0}
        </div>
      `;


      result.innerHTML =
        html;

      result.classList.remove(
        "hidden"
      );
    }


    function showDebug(data) {

      const result =
        document.getElementById("result");


      result.innerHTML = `
        <div class="debug">
          <strong>Diagnostic information</strong>
          <pre>${escapeHtml(
            JSON.stringify(data, null, 2)
          )}</pre>
        </div>
      `;


      result.classList.remove(
        "hidden"
      );
    }


    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

  </script>

</body>
</html>
